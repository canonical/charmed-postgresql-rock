name: Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:

jobs:
  lint:
    name: Lint
    uses: canonical/data-platform-workflows/.github/workflows/lint.yaml@v30.2.0

  build:
    name: Build rock
    uses: canonical/data-platform-workflows/.github/workflows/build_rock.yaml@v30.2.0
  smoke:
    name: Smoke test rock
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - lint
      - build
    steps:
      - name: Uninstall Postgresql
        run: |
          sudo apt --purge remove postgresql*
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install tox & poetry
        run: |
          pipx install tox
          pipx install poetry
      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install skopeo -y
      - name: Download snap package(s)
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ needs.build.outputs.artifact-prefix }}-*
          merge-multiple: true
      - name: Run tests
        run: tox run -e smoke
