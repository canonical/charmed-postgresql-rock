name: Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:

jobs:
  lint:
    name: Lint
    uses: canonical/data-platform-workflows/.github/workflows/lint.yaml@v34.0.1

  build:
    name: Build rock
    uses: canonical/data-platform-workflows/.github/workflows/build_rock.yaml@v34.0.1
  smoke:
    name: Smoke test rock
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - lint
      - build
    steps:
      - name: Uninstall Postgresql
        run: |
          sudo apt --purge remove postgresql*
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install tox & poetry
        run: |
          pipx install tox
          pipx install poetry
      - name: Download rock(s)
        uses: actions/download-artifact@v5
        with:
          pattern: ${{ needs.build.outputs.artifact-prefix }}-*
          merge-multiple: true
      - name: Run tests
        run: tox run -e smoke
